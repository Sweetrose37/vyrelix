<!doctype html>
<html lang="en" data-theme="nyvera">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17091f">
  <meta name="description" content="Nyvera is a premium prompt-building app for adult characters, kids creations, and professional sticker products.">
  <meta property="og:title" content="Nyvera — Character, Kids & Sticker Studios">
  <meta property="og:description" content="Three creative studios. One powerful imagination.">
  <meta property="og:type" content="website">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nyvera">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https:; media-src 'self' https: blob:; frame-src https://www.iheart.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Nyvera — Character, Kids & Sticker Studios</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/nyvera-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/nyvera-mark-192.png">
  <link rel="stylesheet" href="./css/nyvera.css?v=1.14.0">
  <link rel="stylesheet" href="./css/radio.css?v=1.17.0">
  <link rel="stylesheet" href="./css/unveiled.css?v=1.1.0">
</head>
<body>
  <noscript>Nyvera requires JavaScript to build and save creative prompts.</noscript>
  <a class="skip-link" href="#app-main">Skip to Nyvera</a>

  <div class="ambient" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
    <div class="emblem emblem--loading" aria-hidden="true"><span>N</span></div>
    <p class="wordmark">NYVERA</p>
    <p class="loading-tagline">Where Imagination Becomes Art</p>
    <div class="loading-track"><span></span></div>
  </div>

  <div id="app" class="app-shell" hidden>
    <header class="topbar">
      <button class="brand" type="button" data-action="home" aria-label="Nyvera home">
        <span class="emblem" aria-hidden="true">N</span><span>NYVERA</span>
      </button>
      <div class="topbar__actions">
        <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
        <button class="icon-button radio-launch" type="button" data-radio-open aria-label="Open Nyvera Live Radio" title="Live Radio"><img src="./assets/icons/radio.svg" alt=""></button>
        <button class="icon-button" type="button" data-action="switch-studio" aria-label="Switch studio" title="Switch studio">✦</button>
      </div>
    </header>

    <main id="app-main" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button type="button" data-nav="home" aria-label="Home"><span aria-hidden="true">⌂</span><small>Home</small></button>
      <button type="button" data-nav="create" aria-label="Create"><span aria-hidden="true">＋</span><small>Create</small></button>
      <button type="button" data-nav="projects" aria-label="Projects"><span aria-hidden="true">▤</span><small>Projects</small></button>
      <button type="button" data-nav="favorites" aria-label="Favorites"><span aria-hidden="true">♡</span><small>Favorites</small></button>
      <button type="button" data-nav="settings" aria-label="Settings"><span aria-hidden="true">⚙</span><small>Settings</small></button>
    </nav>
  </div>

  <audio id="nyvera-radio-audio" preload="none"></audio>
  <div id="nyvera-radio-root"></div>
  <aside id="nyvera-iheart-persistent" class="iheart-persistent" aria-label="Persistent iHeartRadio player" hidden></aside>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="dialog-layer"></div>
  <input id="project-import" type="file" accept="application/json,.json" hidden>
  <input id="all-data-import" type="file" accept="application/json,.json" hidden>

  <script type="module" src="./js/app.js?v=1.19.0"></script>
  <script type="module" src="./js/radio.js?v=1.17.0"></script>
</body>
</html>
